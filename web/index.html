<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz Barbearia - Painel Administrativo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #F7F5F0; color: #1A1D1A; font-family: sans-serif; }
        .bg-forest { background-color: #1C4332 !important; }
        .card { border-radius: 14px; border: 1px solid #E6E2D8; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-forest shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">RAIZ BARBEARIA — Painel Web</span>
        </div>
    </nav>

    <div class="container">
        <!-- Secção de Avaliações e Feedback dos Clientes -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-forest text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">⭐ Avaliações e Feedback dos Clientes</h5>
                <span id="mediaEstrelas" class="badge bg-light text-dark fs-6">Média: 5.0 ⭐</span>
            </div>
            <div class="card-body">
                <div id="listaAvaliacoes" class="list-group">
                    <p class="text-muted text-center py-3">A carregar avaliações em tempo real...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // Configuração do Firebase (substitua com as credenciais do seu projeto se necessário)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Sincronização em tempo real com a coleção 'avaliacoes' do Firestore
        db.collection("avaliacoes").onSnapshot((snapshot) => {
            const listaContainer = document.getElementById("listaAvaliacoes");
            const badgeMedia = document.getElementById("mediaEstrelas");
            
            listaContainer.innerHTML = "";
            
            if (snapshot.empty) {
                listaContainer.innerHTML = `<p class="text-muted text-center py-3">Ainda não existem avaliações registadas.</p>`;
                badgeMedia.innerText = "Média: - ⭐";
                return;
            }

            let somaEstrelas = 0;
            let totalAvaliacoes = snapshot.size;
            let htmlContent = "";

            snapshot.forEach((doc) => {
                const aval = doc.data();
                somaEstrelas += aval.estrelas || 0;

                const estrelasVisuais = "⭐".repeat(aval.estrelas || 5);

                htmlContent += `
                    <div class="list-group-item list-group-item-action flex-column align-items-start mb-2 rounded border">
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1 text-success fw-bold">${aval.clienteNome || "Cliente"}</h5>
                            <small class="text-muted">${estrelasVisuais} (${aval.estrelas}/5)</small>
                        </div>
                        <p class="mb-1 text-dark">"${aval.comentario || "Sem comentário adicional."}"</p>
                        <small class="text-secondary">Barbeiro avaliado: <strong>${aval.profissionalNome || "Geral"}</strong></small>
                    </div>
                `;
            });

            const mediaGeral = (somaEstrelas / totalAvaliacoes).toFixed(1);
            badgeMedia.innerText = `Média Geral: ${mediaGeral} ⭐ (${totalAvaliacoes})`;
            
            listaContainer.innerHTML = htmlContent;
        });
    </script>
</body>
</html>
